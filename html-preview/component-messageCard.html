<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message card component — local preview</title><link rel="stylesheet" href="component.css"></head><body><div class="fragment-shell"><header><h1>Message card</h1><a href="index.html">All previews</a></header><div class="fragment-stage"><div class="message-example"><div class="unread-divider" id="firstUnseen">Unread messages</div><div class="message-row incoming message-container" data-id="1"><div><div class="message-channel">WhatsApp</div><div class="message-bubble"><div class="reply-preview">Your trial lesson is confirmed…</div><p>Could you send the meeting link?</p><div class="message-meta">2026-09-15 09:44</div></div><div class="message-tools"><button class="translate-btn" type="button" data-text="Could you send the meeting link?">English</button><button class="translate-btn" type="button" data-text="هل يمكنك إرسال رابط الاجتماع؟">Arabic</button><button id="reply" type="button">Reply</button></div><div id="translation" class="translation-preview" hidden></div></div></div><div class="message-row outgoing message-container" data-id="2"><div class="message-bubble"><p>Of course! I will send it shortly.</p><div class="message-meta">2026-09-15 09:45 ✓✓</div></div></div><div id="replyInfo" style="font-size:12px;color:#475569" hidden></div></div></div></div><script>document.querySelectorAll('.translate-btn').forEach(button=>button.onclick=()=>{const box=document.getElementById('translation');box.textContent=button.dataset.text;box.hidden=false});document.getElementById('reply').onclick=()=>{const box=document.getElementById('replyInfo');box.textContent='Replying to: Could you send the meeting link?';box.hidden=false}</script></body></html>
