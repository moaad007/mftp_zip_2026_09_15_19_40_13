<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send form component — local preview</title><link rel="stylesheet" href="component.css"></head><body><div class="fragment-shell"><header><h1>Send message form</h1><a href="index.html">All previews</a></header><div class="fragment-stage"><div id="formSendMessage" class="composer"><div class="composer-top"><label for="typeInput">Message type</label><select id="typeInput"><option>WhatsApp</option><option>WhatsApp Student Support</option><option>Email</option><option>SMS</option></select><button id="sendGreetingBtn" class="greeting" type="button" aria-label="Send greeting">👋</button></div><form id="message-form"><label for="fileInput" class="icon-button" title="Upload file">＋</label><input id="fileInput" type="file" hidden><button id="btnEmoji" class="icon-button" type="button">☺</button><textarea id="messageInput" placeholder="Type a message"></textarea><button id="sendMessage" class="send-button" type="submit">➤</button></form><div id="attachment-name" class="attachment-name" hidden></div><p id="sendResult" style="font-size:12px;color:#64748b" aria-live="polite"></p></div></div></div><script>const input=document.getElementById('messageInput');document.getElementById('sendGreetingBtn').onclick=()=>{input.value='Hello! Welcome to Boston English Center 👋';input.focus()};document.getElementById('btnEmoji').onclick=()=>{input.value+='😊';input.focus()};document.getElementById('fileInput').onchange=e=>{const box=document.getElementById('attachment-name');box.textContent=e.target.files[0]?.name||'';box.hidden=!e.target.files.length};document.getElementById('message-form').onsubmit=e=>{e.preventDefault();document.getElementById('sendResult').textContent=input.value.trim()?`Preview sent via ${document.getElementById('typeInput').value}: ${input.value.trim()}`:'Enter a message to send';input.value=''};</script></body></html>
